<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Q-Blog —— 一个记录技术、思考与折腾的个人博客。">
  <meta name="theme-color" content="#0b0f19">
  <title>Q-Blog · 个人博客</title>

  <!-- 防止主题闪烁：首帧渲染前就应用已保存/系统偏好的主题 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("qblog-theme");
        var dark = saved === "dark" ||
          (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>

  <style>
    :root {
      --bg: #f4f6fb;
      --surface: rgba(255, 255, 255, .72);
      --surface-solid: #ffffff;
      --text: #16181d;
      --muted: #687080;
      --line: rgba(20, 25, 35, .10);
      --accent: #5b5ce2;
      --accent-2: #8b5cf6;
      --accent-soft: rgba(91, 92, 226, .14);
      --shadow: 0 18px 60px rgba(25, 30, 55, .10);
      --radius: 22px;
      --max-width: 1120px;
      --ease: .22s ease;
      --viewport-height: 100vh;
      --header-height: 65px;
    }

    /* 动态视口可随移动端地址栏展开/收起而变化；旧浏览器仍回退到 100vh。 */
    @supports (height: 100dvh) {
      :root { --viewport-height: 100dvh; }
    }

    html.dark {
      --bg: #080b12;
      --surface: rgba(17, 22, 34, .72);
      --surface-solid: #111622;
      --text: #f2f4f8;
      --muted: #9ba4b5;
      --line: rgba(255, 255, 255, .10);
      --accent: #818cf8;
      --accent-2: #a78bfa;
      --accent-soft: rgba(129, 140, 248, .18);
      --shadow: 0 18px 70px rgba(0, 0, 0, .32);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: var(--header-height);
      /* 全屏翻页机制：滚轮/触控板拨一下即吸附到下一屏 */
      scroll-snap-type: y mandatory;
    }

    /* 未来每个全屏板块只需添加 class="full"，即可纳入吸附分页 */
    .full {
      min-height: calc(var(--viewport-height) - var(--header-height));
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    /* 让全屏板块的内容在页面内垂直居中，排版与其他屏保持一致 */
    .full > .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      min-height: calc(var(--viewport-height) - var(--header-height));
      padding: 90px 0;
      text-align: center;
    }

    .full h2 {
      margin: 0 0 4px;
      max-width: 880px;
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      line-height: 1.05;
      letter-spacing: -.05em;
      font-weight: 900;
    }

    .full .btn {
      margin-top: 14px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family:
        Inter, "Noto Sans SC", "Microsoft YaHei", system-ui,
        -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 8%, var(--accent-soft), transparent 30rem),
        radial-gradient(circle at 90% 78%, rgba(139, 92, 246, .13), transparent 28rem),
        var(--bg);
      line-height: 1.7;
      transition: background .3s ease, color .3s ease;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    img svg { display: block; }

    .container {
      width: min(calc(100% - 40px), var(--max-width));
      margin: 0 auto;
    }

    /* Navigation */
    .nav-wrap {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 14px 0;
      background: color-mix(in srgb, var(--bg) 72%, transparent);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 11px;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 8px 24px rgba(91, 92, 226, .28);
    }

    /* Focus ring for keyboard users */
    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
      border-radius: 10px;
    }

    .theme-btn {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font-size: 1.05rem;
      line-height: 1;
      cursor: pointer;
      transition: var(--ease);
    }

    .theme-btn:hover {
      background: var(--surface-solid);
      transform: translateY(-1px);
    }

    /* Hero */
    .hero {
      position: relative;
      min-height: calc(var(--viewport-height) - var(--header-height));
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 0;
    }

    .hero-inner {
      width: 100%;
      text-align: center;
    }

    h1 {
      margin: 26px auto 18px;
      max-width: 880px;
      font-size: clamp(3.4rem, 11vw, 8rem);
      line-height: .98;
      letter-spacing: -.075em;
      font-weight: 900;
      white-space: nowrap;
    }

    .gradient-text {
      background: linear-gradient(120deg, var(--text) 15%, var(--accent) 52%, var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      padding-right: .075em;
    }

    .hero .lead {
      max-width: 660px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.18rem);
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      min-width: 120px;
      padding: 0 22px;
      border-radius: 13px;
      border: 1px solid var(--line);
      font-weight: 700;
      transition: transform var(--ease), box-shadow var(--ease);
    }

    .btn:hover { transform: translateY(-2px); }

    .btn-primary {
      color: white;
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 12px 28px rgba(91, 92, 226, .25);
    }

    .btn-secondary { background: var(--surface); backdrop-filter: blur(12px); }
    .btn-secondary:hover { background: var(--surface-solid); }

    .scroll-hint {
      position: absolute;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: .76rem;
      letter-spacing: .12em;
      opacity: .75;
      text-align: center;
    }

    .scroll-hint span {
      display: block;
      width: 1px;
      height: 30px;
      margin: 6px auto 0;
      background: var(--muted);
      opacity: .8;
    }

    /* 全屏测试页 */
    .section-kicker {
      margin: 0 0 2px;
      color: var(--accent);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .test-desc {
      margin: 0;
      max-width: 640px;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.2rem);
    }

    /* Footer */
    footer {
      padding: 30px 0 42px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .84rem;
      scroll-snap-align: end;
      scroll-snap-stop: always;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    /* Responsive */
    @media (max-width: 620px) {
      .container {
        width: min(calc(100% - 28px), var(--max-width));
      }

      h1 {
        font-size: clamp(3.2rem, 20vw, 5rem);
      }

      .btn { min-width: 100%; }
      .footer-inner { justify-content: center; text-align: center; }
    }

    /* Respect reduced-motion preferences */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <header class="nav-wrap">
    <div class="container">
      <nav aria-label="主导航">
        <a class="brand" href="./" aria-label="Q-Blog 首页">
          <span class="brand-mark">Q</span>
          <span>Q-Blog</span>
        </a>

        <button class="theme-btn" id="themeToggle" type="button"
                aria-label="切换明暗主题" title="切换明暗主题">◐</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero full" id="home">
      <div class="container hero-inner">
        <h1><span class="gradient-text">QBDCQ</span></h1>

        <p class="lead">
          这里是 Q-Blog。记录技术实验、项目开发与一些值得留下来的想法。
        </p>

        <div class="hero-actions">
          <a class="btn btn-primary" href="#home">开始探索</a>
          <a class="btn btn-secondary" href="#home">了解更多</a>
        </div>
      </div>

      <div class="scroll-hint" aria-hidden="true">
        SCROLL
        <span></span>
      </div>
    </section>

    <section class="full" id="about">
      <div class="container">
        <p class="section-kicker">About</p>
        <h2>这里是一页测试</h2>
        <p class="test-desc">
          这是第二页（关于测试页）。向下滚动即可翻到下一页。
        </p>
        <a class="btn btn-secondary" href="#contact">翻到下一页 →</a>
      </div>
    </section>

    <section class="full" id="contact">
      <div class="container">
        <p class="section-kicker">Contact</p>
        <h2>这里是第三页</h2>
        <p class="test-desc">
          第三屏（联系测试页）。内容随意，仅用于验证整页吸附翻页。
        </p>
        <a class="btn btn-primary" href="#home">回到首页 ↑</a>
      </div>
    </section>
  </main>

  <footer>
    <div class="container footer-inner">
      <span>© <span id="year"></span> Q-Blog</span>
      <span><a href="mobile.html" id="mobileLink" style="color: var(--accent)">手机版</a> · Built with HTML · CSS · JavaScript</span>
    </div>
  </footer>

  <script>
    // 主题切换：在前端记住访客偏好，并同步按钮状态
    const root = document.documentElement;
    const toggle = document.getElementById("themeToggle");

    function applyTheme(theme) {
      root.classList.toggle("dark", theme === "dark");
      toggle.textContent = theme === "dark" ? "☀" : "◐";
      toggle.setAttribute(
        "aria-label",
        theme === "dark" ? "切换到浅色主题" : "切换到深色主题"
      );
    }

    // 读取内联脚本已应用的初始化主题（若为深色则为 dark，否则 light）
    const current = root.classList.contains("dark") ? "dark" : "light";
    applyTheme(current);

    toggle.addEventListener("click", () => {
      const next = root.classList.contains("dark") ? "light" : "dark";
      try { localStorage.setItem("qblog-theme", next); } catch (e) {}
      applyTheme(next);
    });

    document.getElementById("year").textContent = new Date().getFullYear();

    // 以实际可见区域计算每屏高度：浏览器地址栏、书签栏或窗口尺寸变化后立即重算。
    (function () {
      var header = document.querySelector(".nav-wrap");

      function updateViewportSize() {
        var viewport = window.visualViewport;
        var height = viewport ? viewport.height : window.innerHeight;
        root.style.setProperty("--viewport-height", Math.round(height) + "px");
        if (header) root.style.setProperty("--header-height", header.offsetHeight + "px");
      }

      updateViewportSize();
      window.addEventListener("resize", updateViewportSize);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", updateViewportSize);
      }
      if (header && window.ResizeObserver) {
        new ResizeObserver(updateViewportSize).observe(header);
      }
    })();

    // 桌面滚轮按屏翻页：一次拨动只会切换到相邻的全屏区块，
    // 并在动画期间吞掉同一拨动产生的后续 wheel 事件，避免连跳多屏。
    (function () {
      // 页脚同样是最后一个滚动停靠点，需纳入序列以便向上先回到第三屏。
      var pages = Array.prototype.slice.call(document.querySelectorAll(".full, footer"));
      var paging = false;
      var supportsFinePointer = window.matchMedia("(pointer: fine)").matches;
      var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (!supportsFinePointer || !pages.length) return;

      window.addEventListener("wheel", function (event) {
        if (event.ctrlKey || !event.deltaY) return;

        // 锁定期间仍阻止浏览器默认滚动，防止一拨滚轮累计成多次翻页。
        if (paging) {
          event.preventDefault();
          return;
        }

        var direction = event.deltaY > 0 ? 1 : -1;
        var currentIndex = 0;
        var nearestDistance = Infinity;
        var snapLine = parseFloat(getComputedStyle(document.documentElement).scrollPaddingTop) || 0;
        var viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        var atDocumentEnd = window.scrollY + viewportHeight >= document.documentElement.scrollHeight - 1;

        if (atDocumentEnd) {
          currentIndex = pages.length - 1;
        } else {
          pages.forEach(function (page, index) {
            var distance = Math.abs(page.getBoundingClientRect().top - snapLine);
            if (distance < nearestDistance) {
              nearestDistance = distance;
              currentIndex = index;
            }
          });
        }

        var nextPage = pages[currentIndex + direction];
        if (!nextPage) return;

        event.preventDefault();
        paging = true;
        nextPage.scrollIntoView({ behavior: reducedMotion ? "auto" : "smooth", block: "start" });

        window.setTimeout(function () { paging = false; }, reducedMotion ? 0 : 450);
      }, { passive: false });
    })();

    // “手机版”入口：手动选择的设备只在当前会话生效，下次/换设备自动重新检测
    document.getElementById("mobileLink").addEventListener("click", () => {
      try { sessionStorage.setItem("qblog-device", "mobile"); } catch (e) {}
    });

    // 设备自动检测与跳转：默认按当前设备走，手动选择仅临时覆盖
    (function () {
      function isMobileDevice() {
        var coarse = window.matchMedia("(pointer: coarse)").matches;
        var narrow = window.innerWidth < 768;
        var ua = navigator.userAgentData ? navigator.userAgentData.mobile
          : /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
        return coarse || narrow || ua === true;
      }
      try {
        var pref = sessionStorage.getItem("qblog-device");
        if (pref !== "desktop" && isMobileDevice()) location.replace("mobile.html");
      } catch (e) {}
    })();
  </script>
</body>
</html>
