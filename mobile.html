<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Q-Blog —— 一个记录技术、思考与折腾的个人博客（手机版）。">
  <meta name="theme-color" content="#0b0f19">
  <title>Q-Blog · 手机版</title>

  <!-- 防止主题闪烁：首帧渲染前就应用已保存/系统偏好的主题 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("qblog-theme");
        var dark = saved === "dark" ||
          (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>

  <!-- 设备自动检测：桌面设备回到桌面版；手动选择仅当前会话生效 -->
  <script>
    function isMobileDevice() {
      var coarse = window.matchMedia("(pointer: coarse)").matches;
      var narrow = window.innerWidth < 768;
      var ua = navigator.userAgentData ? navigator.userAgentData.mobile
        : /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
      return coarse || narrow || ua === true;
    }
    (function () {
      try {
        var pref = sessionStorage.getItem("qblog-device");
        if (pref !== "mobile" && !isMobileDevice()) location.replace("index.html");
      } catch (e) {}
    })();
  </script>

  <style>
    :root {
      --bg: #f4f6fb;
      --surface: rgba(255, 255, 255, .9);
      --surface-solid: #ffffff;
      --text: #16181d;
      --muted: #687080;
      --line: rgba(20, 25, 35, .10);
      --accent: #5b5ce2;
      --accent-2: #8b5cf6;
      --accent-soft: rgba(91, 92, 226, .14);
      --shadow: 0 14px 40px rgba(25, 30, 55, .10);
      --radius: 18px;
      --max-width: 480px;
      --ease: .22s ease;
      --viewport-height: 100vh;
      --header-height: 60px;
    }

    @supports (height: 100dvh) {
      :root { --viewport-height: 100dvh; }
    }

    html.dark {
      --bg: #080b12;
      --surface: rgba(17, 22, 34, .9);
      --surface-solid: #111622;
      --text: #f2f4f8;
      --muted: #9ba4b5;
      --line: rgba(255, 255, 255, .10);
      --accent: #818cf8;
      --accent-2: #a78bfa;
      --accent-soft: rgba(129, 140, 248, .18);
      --shadow: 0 14px 44px rgba(0, 0, 0, .32);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: var(--header-height);
    }

    body {
      margin: 0;
      min-height: var(--viewport-height);
      font-family:
        Inter, "Noto Sans SC", "Microsoft YaHei", system-ui,
        -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 5%, var(--accent-soft), transparent 40vw),
        radial-gradient(circle at 92% 88%, rgba(139, 92, 246, .13), transparent 42vw),
        var(--bg);
      line-height: 1.7;
      transition: background .3s ease, color .3s ease;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    .container {
      width: min(calc(100% - 28px), var(--max-width));
      margin: 0 auto;
    }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
      border-radius: 10px;
    }

    /* 顶部导航：品牌 + 桌面版入口 + 主题按钮，触控目标足够大 */
    .nav-wrap {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: calc(12px + env(safe-area-inset-top)) 0 12px;
      background: color-mix(in srgb, var(--bg) 78%, transparent);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 1.02rem;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 6px 18px rgba(91, 92, 226, .28);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      display: grid;
      place-items: center;
      min-width: 42px;
      height: 42px;
      padding: 0 10px;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      transition: var(--ease);
    }

    .icon-btn:hover { background: var(--surface-solid); }

    .text-link {
      padding: 9px 12px;
      border-radius: 10px;
      color: var(--muted);
      font-size: .88rem;
      background: transparent;
      transition: var(--ease);
    }
    .text-link:hover { color: var(--text); background: var(--surface); }

    /* Hero 首屏：沿用桌面端的单一主标题，但保持触控端自然滚动。 */
    .hero {
      position: relative;
      display: grid;
      place-items: center;
      min-height: calc(var(--viewport-height) - var(--header-height));
      padding: 0;
      text-align: center;
    }

    h1, h2 {
      margin: 0;
      letter-spacing: -.05em;
      font-weight: 900;
    }

    h1 {
      margin: 0 auto 16px;
      max-width: 90%;
      font-size: clamp(3rem, 16vw, 4.5rem);
      line-height: 1.02;
      white-space: nowrap;
    }

    .gradient-text {
      background: linear-gradient(120deg, var(--text) 15%, var(--accent) 52%, var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lead, .test-desc {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .hero-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 30px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 54px;
      padding: 0 22px;
      border-radius: 14px;
      border: 1px solid var(--line);
      font-weight: 700;
      font-size: 1rem;
      transition: var(--ease);
    }

    .btn-primary {
      color: white;
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 24px rgba(91, 92, 226, .28);
    }

    .btn-secondary {
      background: var(--surface);
    }
    .btn-secondary:hover { background: var(--surface-solid); }

    /* 内容板块：卡片式自然堆叠 */
    section.panel {
      padding: 40px 0;
    }

    .card {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .card h2 {
      margin: 10px 0;
      font-size: clamp(2rem, 9vw, 2.8rem);
      line-height: 1.08;
    }

    .card p { margin: 0 0 6px; }

    .section-kicker {
      margin: 0;
      color: var(--accent);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .card .btn { margin-top: 18px; }

    /* 页脚 */
    footer {
      padding: 30px 0 calc(44px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .82rem;
    }

    .footer-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    /* 减少动效偏好 */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <header class="nav-wrap">
    <div class="container">
      <nav aria-label="主导航">
        <a class="brand" href="./" aria-label="Q-Blog 首页">
          <span class="brand-mark">Q</span>
          <span>Q-Blog</span>
        </a>

        <div class="nav-actions">
          <button class="text-link" id="desktopLink" type="button"
                  title="在桌面设备打开完整版">桌面版</button>
          <button class="icon-btn" id="themeToggle" type="button"
                  aria-label="切换明暗主题" title="切换明暗主题">◐</button>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" id="home">
      <div class="container">
        <h1><span class="gradient-text">QBDCQ</span></h1>

        <p class="lead">
          这里是 Q-Blog。记录技术实验、项目开发与一些值得留下来的想法。
        </p>

        <div class="hero-actions">
          <a class="btn btn-primary" href="#about">开始浏览</a>
          <a class="btn btn-secondary" href="#contact">了解更多</a>
        </div>
      </div>
    </section>

    <section class="panel" id="about">
      <div class="container">
        <div class="card">
          <p class="section-kicker">About</p>
          <h2>这里是一页测试</h2>
          <p class="test-desc">
            这是第二节（关于测试）。手机版为自然滚动，可直接上下滑动。
          </p>
          <a class="btn btn-secondary" href="#contact">继续向下 ↓</a>
        </div>
      </div>
    </section>

    <section class="panel" id="contact">
      <div class="container">
        <div class="card">
          <p class="section-kicker">Contact</p>
          <h2>这里是第三节</h2>
          <p class="test-desc">
            第三节（联系测试）。内容仅用于验证手机端布局与触控体验。
          </p>
          <a class="btn btn-primary" href="#home">回到顶部 ↑</a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container footer-inner">
      <span>© <span id="year"></span> Q-Blog</span>
      <span>手机版 · 桌面版有整页翻页效果</span>
    </div>
  </footer>

  <script>
    // 主题切换并与桌面版共用同一偏好
    const root = document.documentElement;
    const toggle = document.getElementById("themeToggle");

    // 以实际可见区域计算首屏高度，处理移动端地址栏、刘海安全区和横竖屏切换。
    (function () {
      var header = document.querySelector(".nav-wrap");

      function updateViewportSize() {
        var viewport = window.visualViewport;
        var height = viewport ? viewport.height : window.innerHeight;
        root.style.setProperty("--viewport-height", Math.round(height) + "px");
        if (header) root.style.setProperty("--header-height", header.offsetHeight + "px");
      }

      updateViewportSize();
      window.addEventListener("resize", updateViewportSize);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", updateViewportSize);
      }
      if (header && window.ResizeObserver) {
        new ResizeObserver(updateViewportSize).observe(header);
      }
    })();

    function applyTheme(theme) {
      root.classList.toggle("dark", theme === "dark");
      toggle.textContent = theme === "dark" ? "☀" : "◐";
      toggle.setAttribute(
        "aria-label",
        theme === "dark" ? "切换到浅色主题" : "切换到深色主题"
      );
    }

    applyTheme(root.classList.contains("dark") ? "dark" : "light");

    toggle.addEventListener("click", () => {
      const next = root.classList.contains("dark") ? "light" : "dark";
      try { localStorage.setItem("qblog-theme", next); } catch (e) {}
      applyTheme(next);
    });

    // “桌面版”入口：手动选择的设备只在当前会话生效，下次/换设备自动重新检测
    document.getElementById("desktopLink").addEventListener("click", () => {
      try { sessionStorage.setItem("qblog-device", "desktop"); } catch (e) {}
      location.href = "index.html";
    });

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
